<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <title>400 — Bad Request | MwohaOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-6 font-sans">
  <div class="max-w-md w-full bg-slate-800/90 border border-slate-700 p-8 rounded-lg text-center shadow-2xl">
    <span class="inline-block px-2.5 py-0.5 text-xs font-mono font-bold bg-amber-950 text-amber-300 border border-amber-800 rounded">
      HTTP 400
    </span>
    <h1 class="text-2xl font-bold text-white mt-4 tracking-tight">Bad Request</h1>
    <p class="text-xs text-slate-400 mt-2 leading-relaxed">
      The server cannot process the request due to malformed syntax or an invalid client parameter.
    </p>
    <div class="mt-6 pt-6 border-t border-slate-700">
      <a href="/dashboard/" class="inline-flex items-center px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-md transition">
        Return to Dashboard
      </a>
    </div>
  </div>
</body>
</html>
