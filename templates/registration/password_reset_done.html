{% extends "base.html" %}

{% block title %}Reset Sent{% endblock %}

{% block unauth_content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md">
  <div class="bg-slate-800 border border-slate-700 py-8 px-6 shadow-xl rounded-lg text-center">
    <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-blue-900/60 text-blue-400 mb-3">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    <h3 class="text-lg font-semibold text-white">Instructions Dispatched</h3>
    <p class="text-xs text-slate-400 mt-2">
      If an account exists with that email address, password reset instructions have been generated.
    </p>
    <div class="mt-6 pt-6 border-t border-slate-700">
      <a href="{% url 'accounts:login' %}" class="text-xs text-blue-400 hover:text-blue-300">
        ← Return to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
