{% extends "base.html" %}

{% block title %}Password Changed{% endblock %}
{% block header_title %}Password Changed{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm text-center">
    <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 mb-3">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
    </div>
    <h2 class="text-base font-semibold text-slate-900">Password Updated Successfully</h2>
    <p class="text-xs text-slate-500 mt-1">Your new password is now active across all sessions.</p>
    <div class="mt-6">
      <a href="{% url 'accounts:settings' %}" 
         class="inline-flex items-center px-4 py-2 bg-slate-900 text-white rounded text-xs font-medium hover:bg-slate-800 transition">
        Return to Settings
      </a>
    </div>
  </div>
</div>
{% endblock %}
