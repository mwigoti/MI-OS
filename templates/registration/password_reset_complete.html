{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block unauth_content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md">
  <div class="bg-slate-800 border border-slate-700 py-8 px-6 shadow-xl rounded-lg text-center">
    <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-emerald-900/60 text-emerald-400 mb-3">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
    </div>
    <h3 class="text-lg font-semibold text-white">Password Reset Complete</h3>
    <p class="text-xs text-slate-400 mt-2">
      Your password has been reset successfully. You may now sign in using your new credentials.
    </p>
    <div class="mt-6 pt-6 border-t border-slate-700">
      <a href="{% url 'accounts:login' %}" 
         class="inline-flex items-center px-4 py-2 border border-transparent rounded-md text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 transition">
        Sign In Now
      </a>
    </div>
  </div>
</div>
{% endblock %}
