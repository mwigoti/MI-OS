{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block unauth_content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md">
  <div class="text-center">
    <div class="inline-flex items-center space-x-2 text-white font-bold tracking-tight text-2xl">
      <span class="inline-block w-4 h-4 bg-blue-500 rounded-sm"></span>
      <span>MwohaOS</span>
    </div>
    <h2 class="mt-2 text-sm text-slate-400">Password Recovery</h2>
  </div>

  <div class="mt-8 bg-slate-800/80 border border-slate-700/80 py-8 px-6 shadow-xl rounded-lg sm:px-10">
    <div class="mb-6 pb-4 border-b border-slate-700">
      <h3 class="text-lg font-semibold text-white">Reset your password</h3>
      <p class="text-xs text-slate-400 mt-1">Enter your email address and we will generate a password reset link.</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_email" class="block text-xs font-medium text-slate-300 mb-1">Account Email</label>
        <input type="email" name="email" required id="id_email"
               class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-md text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>

      <div class="pt-2">
        <button type="submit" 
                class="w-full py-2.5 px-4 border border-transparent rounded-md text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 transition shadow">
          Send Reset Instructions
        </button>
      </div>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
      <a href="{% url 'accounts:login' %}" class="text-xs text-slate-400 hover:text-white">
        ← Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
